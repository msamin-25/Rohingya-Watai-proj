name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "ml[dev,llm]" -r backend/requirements-dev.txt

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: frontend/dist is up to date
        run: |
          (cd frontend && npm run build)
          git diff --exit-code -- frontend/dist || (echo "::error::Run 'cd frontend && npm run build' and commit frontend/dist" && exit 1)

      - name: ML tests (incl. JS/Python parity)
        working-directory: ml
        run: ../.venv/bin/python -m pytest -q

      - name: Backend tests
        working-directory: backend
        run: ../.venv/bin/python -m pytest -q

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: No private data or secrets committed
        run: |
          if git ls-files | grep -Ei '(^|/)\.env$|\.(wav|m4a|mp3|ogg|webm|aiff|zip)$|^var/'; then
            echo "::error::Private voice data or .env is tracked by git"; exit 1
          fi

      - name: Dependency audit
        run: |
          .venv/bin/python -m pip_audit --skip-editable -r backend/requirements.txt
          (cd frontend && npm audit --audit-level=high)

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e "ml[dev,llm]" -r backend/requirements-dev.txt
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
